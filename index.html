<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey's Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-top: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rey's Expense Tracker</h1>

        <h2>Add New Expense</h2>
        <form id="expenseForm">
            <input type="text" id="title" placeholder="Title" required>
            <input type="number" id="amount" placeholder="Amount (Rp.)" required>
            <input type="text" id="category" placeholder="Category" required>
            <input type="text" id="date" placeholder="DD-MM-YYYY" required>
            <button type="submit">Add</button>
        </form>

        <h2>Expenses List</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseTableBody">
                <!-- Expenses will be rendered dynamically -->
            </tbody>
        </table>

        <div class="summary">
            <div><strong>Total:</strong> <span id="totalAmount">Rp. 0</span></div>
            <div><strong>Count:</strong> <span id="totalCount">0</span></div>
            <div><strong>Average:</strong> <span id="avgAmount">Rp. 0</span></div>
            <div><strong>Highest:</strong> <span id="highestAmount">Rp. 0</span></div>
        </div>
    </div>

    <script>
        // Load stored expenses from browser localStorage, or default to empty array
        let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

        const form = document.getElementById("expenseForm");
        const tableBody = document.getElementById("expenseTableBody");

        // Function to render expenses into table and recalculate statistics
        function renderExpenses() {
            tableBody.innerHTML = "";

            if (expenses.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No expenses recorded.</td></tr>`;
                updateSummary(0, 0, 0, 0);
                return;
            }

            let total = 0;
            let highest = 0;

            expenses.forEach((expense, index) => {
                total += expense.amount;
                if (expense.amount > highest) highest = expense.amount;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${expense.title}</td>
                    <td>Rp. ${expense.amount.toLocaleString('id-ID')}</td>
                    <td>${expense.category}</td>
                    <td>${expense.date}</td>
                    <td><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></td>
                `;
                tableBody.appendChild(row);
            });

            const count = expenses.length;
            const avg = total / count;

            updateSummary(total, count, avg, highest);
        }

        function updateSummary(total, count, avg, highest) {
            document.getElementById("totalAmount").textContent = `Rp. ${total.toLocaleString('id-ID')}`;
            document.getElementById("totalCount").textContent = count;
            document.getElementById("avgAmount").textContent = `Rp. ${Math.round(avg).toLocaleString('id-ID')}`;
            document.getElementById("highestAmount").textContent = `Rp. ${highest.toLocaleString('id-ID')}`;
        }

        // Add expense listener
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const amount = parseFloat(document.getElementById("amount").value);
            const category = document.getElementById("category").value.trim();
            const date = document.getElementById("date").value.trim();

            const newExpense = { title, amount, category, date };
            expenses.push(newExpense);

            // Save array to browser storage
            localStorage.setItem("expenses", JSON.stringify(expenses));

            // Reset form inputs & re-render table
            form.reset();
            renderExpenses();
        });

        // Delete expense function
        function deleteExpense(index) {
            expenses.splice(index, 1);
            localStorage.setItem("expenses", JSON.stringify(expenses));
            renderExpenses();
        }

        // Initial call on page load
        renderExpenses();
    </script>
</body>
</html>
