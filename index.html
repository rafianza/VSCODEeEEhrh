<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey's Expense Tracker</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --info: #0ea5e9;
            --info-hover: #0284c7;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Styling */
        form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: var(--radius);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-btn { background-color: var(--primary); color: white; }
        .add-btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        .save-btn { background-color: var(--success); color: white; }
        .save-btn:hover { background-color: var(--success-hover); transform: translateY(-1px); }

        .load-btn { background-color: var(--info); color: white; }
        .load-btn:hover { background-color: var(--info-hover); transform: translateY(-1px); }

        .delete-btn {
            background-color: #fee2e2;
            color: var(--danger);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
        }
        .delete-btn:hover { background-color: var(--danger); color: white; }

        /* Summary Cards */
        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: var(--radius);
            text-align: left;
        }

        .summary-card strong {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .summary-card span {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Table Styling */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
            background: white;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }

        /* Category Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: lowercase;
        }

        .badge-commute { background: #e0f2fe; color: #0369a1; }
        .badge-fnb { background: #ffedd5; color: #c2410c; }
        .badge-hobbies { background: #f3e8ff; color: #6b21a8; }
        .badge-hangout { background: #fce7f3; color: #be185d; }
        .badge-groceries { background: #dcfce7; color: #15803d; }
        .badge-transport { background: #f1f5f9; color: #334155; }

        /* Alert Toast */
        .alert-box {
            padding: 12px 20px;
            margin-bottom: 20px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            display: none;
            text-align: center;
            font-weight: 500;
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        /* Responsive Breakpoints */
        @media (min-width: 640px) {
            form { grid-template-columns: 1fr 1fr; }
            .btn-group { grid-template-columns: 1fr 1fr; }
            .summary { grid-template-columns: repeat(4, 1fr); }
            .container { padding: 40px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Rey's Expense Tracker</h1>
            <p>Track, manage, and optimize your personal spending</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <h2>Add New Transaction</h2>
        <form id="expenseForm">
            <input type="text" id="title" placeholder="Title (e.g., Kopi Janji Jiwa)" required>
            <input type="number" id="amount" placeholder="Amount (Rp.)" required>
            
            <select id="category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="commute">commute</option>
                <option value="fnb">fnb</option>
                <option value="hobbies">hobbies</option>
                <option value="hangout">hangout</option>
                <option value="groceries">groceries</option>
                <option value="transport">transport</option>
            </select>

            <input type="date" id="date" required>
            <button type="submit" class="add-btn" style="grid-column: 1 / -1;">+ Add Expense</button>
        </form>

        <h2>Storage Options</h2>
        <div class="btn-group">
            <button type="button" class="save-btn" onclick="manualSave()">💾 Save Expenses</button>
            <button type="button" class="load-btn" onclick="manualLoad()">🔄 Load Saved Expenses</button>
        </div>

        <h2>Recent Transactions</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                    <!-- Dynamic rendering -->
                </tbody>
            </table>
        </div>

        <div class="summary">
            <div class="summary-card">
                <strong>Total Spent</strong>
                <span id="totalAmount">Rp. 0</span>
            </div>
            <div class="summary-card">
                <strong>Total Items</strong>
                <span id="totalCount">0</span>
            </div>
            <div class="summary-card">
                <strong>Average</strong>
                <span id="avgAmount">Rp. 0</span>
            </div>
            <div class="summary-card">
                <strong>Highest</strong>
                <span id="highestAmount">Rp. 0</span>
            </div>
        </div>
    </div>

    <script>
        let expenses = [];

        const form = document.getElementById("expenseForm");
        const tableBody = document.getElementById("expenseTableBody");
        const alertBox = document.getElementById("alertBox");

        function showAlert(message) {
            alertBox.textContent = message;
            alertBox.style.display = "block";
            setTimeout(() => {
                alertBox.style.display = "none";
            }, 2500);
        }

        function saveToStorage() {
            localStorage.setItem("expenses", JSON.stringify(expenses));
        }

        function loadFromStorage() {
            const stored = localStorage.getItem("expenses");
            expenses = stored ? JSON.parse(stored) : [];
        }

        function manualSave() {
            saveToStorage();
            showAlert("Expenses saved successfully!");
        }

        function manualLoad() {
            loadFromStorage();
            renderExpenses();
            showAlert("Expenses reloaded from storage!");
        }

        function renderExpenses() {
            tableBody.innerHTML = "";

            if (expenses.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 24px;">No expenses recorded yet.</td></tr>`;
                updateSummary(0, 0, 0, 0);
                return;
            }

            let total = 0;
            let highest = 0;

            expenses.forEach((expense, index) => {
                total += expense.amount;
                if (expense.amount > highest) highest = expense.amount;

                const row = document.createElement("tr");
                row.innerHTML = `
                    <td style="color: var(--text-muted);">${index + 1}</td>
                    <td><strong>${expense.title}</strong></td>
                    <td style="font-weight: 600;">Rp. ${expense.amount.toLocaleString('id-ID')}</td>
                    <td><span class="badge badge-${expense.category}">${expense.category}</span></td>
                    <td style="color: var(--text-muted); font-size: 0.85rem;">${expense.date}</td>
                    <td><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></td>
                `;
                tableBody.appendChild(row);
            });

            const count = expenses.length;
            const avg = total / count;

            updateSummary(total, count, avg, highest);
        }

        function updateSummary(total, count, avg, highest) {
            document.getElementById("totalAmount").textContent = `Rp. ${total.toLocaleString('id-ID')}`;
            document.getElementById("totalCount").textContent = count;
            document.getElementById("avgAmount").textContent = `Rp. ${Math.round(avg).toLocaleString('id-ID')}`;
            document.getElementById("highestAmount").textContent = `Rp. ${highest.toLocaleString('id-ID')}`;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const title = document.getElementById("title").value.trim();
            const amount = parseFloat(document.getElementById("amount").value);
            const category = document.getElementById("category").value;
            const date = document.getElementById("date").value;

            expenses.push({ title, amount, category, date });

            saveToStorage();
            form.reset();
            renderExpenses();
            showAlert("Expense added successfully!");
        });

        function deleteExpense(index) {
            expenses.splice(index, 1);
            saveToStorage();
            renderExpenses();
            showAlert("Expense deleted.");
        }

        // Initialize application state
        loadFromStorage();
        renderExpenses();
    </script>
</body>
</html>
